name: CI — Build & Test

on:
  push:
    branches: [main]
    # 사이클 114 (2026-06-12) — 문서/작업 메모만 변경 시 CI/Deploy 미실행.
    # workflow_run trigger 의 deploy.yml 정합 + docker rebuild 비효율 차단.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "_workspace/**"
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile src/main.py && python -m py_compile src/engine/scheduler.py && echo 'Backend syntax OK'

  backend-test:
    runs-on: ubuntu-latest
    # 사이클 59 hotfix: GitHub Actions 기본 6시간 cancel 대신 15분 강제 종료.
    # pytest-timeout 60s 가드 와 이중 안전망.
    timeout-minutes: 15
    # 사이클 M1 (Supabase→RDS 이전): 실 Postgres 통합 테스트용 service 컨테이너.
    # DATABASE_URL_TEST 있으면 pg_harness 가 이 컨테이너를 사용(docker 기동 skip),
    # 없으면 통합 테스트 자체 skip. 기존 단위/mock 테스트는 이 컨테이너와 무관.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpg
          POSTGRES_DB: auto_stock_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage gate
        env:
          DATABASE_URL_TEST: postgresql://postgres:testpg@127.0.0.1:5432/auto_stock_test
        run: python -m pytest --cov=src --cov-report=term:skip-covered -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type check & build
        working-directory: frontend
        run: npm run build

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run vitest
        working-directory: frontend
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies (Playwright)
        run: npm install

      - name: Install frontend dependencies (vite dev server)
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npx playwright test --config=e2e/playwright.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build, backend-test, frontend-build, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target prod -t auto_stock-backend:test .

      - name: Build frontend image
        run: docker build --target prod -t auto_stock-frontend:test ./frontend

      # 🔴 macro 이미지는 여기서 처음 빌드된다(cycle316).
      # 빌드만으로는 부족해서 기동까지 확인한다 — 우리가 이 이미지에서 두 번 밟은 함정
      # (`uvicorn` 미설치 · `COPY sp500.py` 누락)이 **둘 다 빌드는 성공하고 기동에서 죽는** 종류라,
      # `docker build` 의 exit 0 은 아무것도 보장하지 않는다. 그대로 나가면 EC2 에서 컨테이너가 죽는다.
      - name: Build macro image
        run: docker build -t auto_stock-macro:test ./macro

      - name: Smoke — macro 컨테이너가 실제로 뜨고 /health 가 응답하는가
        run: |
          set -euo pipefail
          # 캐시 디렉터리는 이미지 안에 있고(MACRO_LITE_CACHE_DIR), 외부 네트워크 없이도
          # /health 는 응답해야 한다 — 지표 fetch 는 그 경로를 타지 않는다.
          docker run -d --name macro_smoke -p 18010:8000 auto_stock-macro:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18010/health >/dev/null 2>&1; then
              echo "macro /health OK ($i초)"
              docker rm -f macro_smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::macro 컨테이너가 30초 안에 /health 를 응답하지 못했다"
          docker logs macro_smoke || true
          docker rm -f macro_smoke >/dev/null || true
          exit 1
