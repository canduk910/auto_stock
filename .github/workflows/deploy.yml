name: Deploy — EC2 Direct Build

# 사이클 114 (2026-06-12) — CI fail 무시 차단 패턴 영구 가드.
# Before: on push 직접 trigger → CI red 무관 즉시 배포 (사이클 108~112 5 사이클 연속 위험 누적).
# After: workflow_run trigger + CI conclusion=success 의무 → CI fail 시 Deploy 자동 skip.
on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    types: [completed]
    branches: [main]

# cycle248 — 배포 직렬화. 연속 push 로 Deploy 가 겹치면 두 스크립트가 같은 마커/HEAD 를 놓고
# 경쟁한다(어느 인터리빙도 변경을 *놓치지는* 않지만 불필요한 재생성이 생긴다). 진행 중 run 은 취소하지
# 않는다. ⚠️ GitHub 은 그룹당 **대기 1건만** 유지하고 더 오래된 대기 run 은 취소·교체한다(공식 문서) —
# 취소된 대기 run 의 변경은 살아남은 run 의 `git pull` + 마커↔HEAD 누적 diff 가 흡수하므로 유실이 아니라
# 지연이다.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CI success + push event 시에만 진행 (PR/manual trigger 분기 제외).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SUPABASE_DB_URL
          script: |
            # cycle248 — ssh-action v1 은 set -e 를 주입하지 않는다(README: script_stop 제거, 직접 넣으라).
            # 없으면 `git pull` 실패가 구 HEAD 로 이어져 선택 스크립트가 `already_deployed` 로 초록을 만든다(실측).
            set -e
            cd ~/auto_stock
            git pull origin main

            # 사이클 145 (2026-06-16) — Supabase migration 자동 적용 영구 영속 (결함 1 시정).
            # 사이클 129 commit `df8cf82` = production 배포됐으나 migration 034 미적용 silent
            # 결함 (6/13~6/16 매일 16:30 KST PGRST204 master_raw 컬럼 부재 결함).
            # 시정 = 모든 push 후 자동 migration apply (silent 결함 영구 차단).
            # graceful = SUPABASE_DB_URL secret 부재 시 skip + psql 부재 시 skip
            #          (운영자 수동 적용 영역 영구 영속 fallback).
            if [ -n "$SUPABASE_DB_URL" ] && command -v psql >/dev/null 2>&1; then
              echo "[deploy] Supabase migration 자동 적용 시작"
              for migration in supabase/migrations/*.sql; do
                if [ -f "$migration" ]; then
                  echo "[deploy] apply: $migration"
                  psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -f "$migration" 2>&1 | tail -3 || true
                fi
              done
              echo "[deploy] Supabase migration 자동 적용 완료"
            else
              echo "[deploy] SUPABASE_DB_URL secret 또는 psql 부재 — migration 자동 적용 skip (graceful)"
            fi

            # cycle248 (2026-09-04) — 선택적 배포. 종전의 무조건 `up --build` 는 Compose v5.1 에서
            # 이미지 ID 가 같아도 build: 서비스를 전부 재생성해(재태그 → LastTagTime 갱신) 프론트·
            # 문서만 바꾼 push 도 backend 를 ~100초 tick blind 로 몰았다(13db0d9 실측).
            # 스크립트가 마지막 성공 배포 SHA(.deployed_sha)와 HEAD 의 diff 로 full / frontend(--no-deps)
            # / none(빌드 없는 up) 을 고른다. 판정 불가는 전부 full(현행 동작). 상세·계약 = 스크립트 머리말
            # + tests/unit/deploy/test_cycle248_compose_up_changed.py.
            bash tools/deploy/compose_up_changed.sh
