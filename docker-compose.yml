services:
  backend:
    build:
      context: .
      target: dev
    ports:
      - "8002:8000"
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./.token_cache:/app/.token_cache  # 사이클 20 — 토큰 캐시 영속화 (분당 1개 한도 대응)
    env_file: .env
    environment:
      - PORT=8000
      - TZ=Asia/Seoul

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
    environment:
      - VITE_API_URL=http://backend:8000
      # cycle243 Phase 2 — dev 대시보드 생존 경로. 백엔드가 fail-closed 라 키가 없으면
      # 로컬에서도 전 경로 401 이다. **개발 예외·개발용 기본키를 두지 않는다**(커밋되는
      # 기본키는 공격자가 프로덕션에 가장 먼저 시도할 값이고, 모드 분기 예외는 운영이
      # vts 로 도는 날 인증을 조용히 없앤다). 대신 vite proxy 가 서버 측에서 헤더를 넣는다
      # (`frontend/vite.config.ts`). 값은 각자 `.env` 에 둔다(gitignore).
      - API_AUTH_KEY=${API_AUTH_KEY}
      # cycle303 — vite dev 프록시(`/api/macro` prefix)가 컨테이너 네트워크의 macro 를
      # 바라보게 한다. 호스트에서 `npm run dev` 를 직접 띄우는 경로는 대신
      # `VITE_MACRO_API_URL` 미설정 → 기본값 `http://localhost:8010`(macro 서비스 루프백
      # 게시 포트)을 쓴다.
      - VITE_MACRO_API_URL=http://macro:8000
    depends_on:
      - backend
      - macro

  macro:
    # cycle303 — macro_lite 이식 1단계, dev 컨테이너. prod 와 달리 호스트 `npm run dev`
    # (컨테이너 밖 vite)를 위해 루프백 포트를 하나 연다 — 외부 공개가 아니라
    # `127.0.0.1` 바인딩이라 LAN/인터넷에서는 보이지 않는다.
    build:
      context: ./macro
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./macro-cache:/var/lib/macro-lite
    environment:
      - MACRO_LITE_CACHE_DIR=/var/lib/macro-lite
      - FRED_API_KEY=${FRED_API_KEY:-}
      - TZ=Asia/Seoul
