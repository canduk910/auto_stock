[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# 사이클 59 hotfix (2026-06-04): 테스트당 60s 강제 timeout — mock 누락으로 인한
# 외부 호출 (KIS REST / supabase) 무한 hang 즉시 FAIL 전환. backend-test job
# 의 GitHub Actions 6시간 cancel 사고 (사이클 55+) 영구 차단.
timeout = 60
markers = [
    "unit: 단일 함수/메서드 단위 테스트",
    "integration: 모듈 결합 테스트",
    "contract: FastAPI 엔드포인트/외부 API 계약 테스트",
    "slow: 1초 이상 걸리는 테스트 (CI 분리 가능)",
    "safety: 매매 안전성 시나리오 (15:20 강제청산, 체결통보 race 등)",
    # cycle238 — autouse `_pin_pre_market_clock` 옵트아웃. 프리장 청산 보류
    # 게이트의 실 시각 seam(`risk._now_kst`)을 벽시계/freezegun 으로 검증하는
    # 테스트만 붙인다. `filterwarnings = error` 라 미등록 마커는 즉시 실패.
    "real_pre_market_clock: 시각 핀 픽스처 옵트아웃 (실 벽시계 seam 검증)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:supabase.*",
    "ignore::DeprecationWarning:gotrue.*",
    "ignore::DeprecationWarning:postgrest.*",
    # 사이클 101 (2026-06-11): macOS asyncio socketpair GC 경고 무시.
    # Python 3.13 + pytest-asyncio 환경에서 각 async 테스트가 독립 이벤트 루프를
    # 생성·폐기할 때 asyncio 내부 socketpair (AF_UNIX, _make_self_pipe) 가 GC
    # 타이밍에 따라 ResourceWarning 을 발생시키고, pytest 의 PytestUnraisableExceptionWarning
    # 로 변환되어 filterwarnings="error" 에 걸린다. Linux CI 에서는 재현 불가 (macOS 한정).
    # 진짜 ResourceWarning (파일·DB 연결 미닫힘) 은 이 패턴과 다르므로 영향 없음.
    "ignore::ResourceWarning",
    # 사이클 244 (2026-09-03) — 의존성 드리프트 hotfix. anyio 4.15.0 이 `anyio.abc`
    # 를 lazy import 로 바꾸면서 `anyio.abc.BlockingPortal` 접근 시 DeprecationWarning
    # 을 낸다. starlette 0.46.2 의 `testclient.py:37` 이 타입 별칭 정의에 그 경로를
    # 쓰므로, `fastapi.testclient.TestClient` 를 import 하는 **모든** 테스트가
    # `error` 승격에 걸려 **수집 단계에서** 죽는다(CI 실측: 24 errors during
    # collection, run 33753758784). 우리 코드가 아니라 서드파티 내부 호출이라
    # 손댈 수 없다 — starlette 가 `anyio.from_thread.BlockingPortal` 로 옮기면
    # 이 줄을 삭제한다.
    # ⚠️ 로컬(anyio 4.7.0)에서는 경고 자체가 없어 이 필터가 inert 다. 검증은 격리
    # venv(anyio 4.15.0)에서 ignore 없음 → 수집 에러 재현 / ignore 추가 → 통과로
    # 수행했다. 버전 핀 대신 필터를 택한 이유 = anyio 를 구버전에 묶으면 무관한
    # 보안·버그 수정까지 함께 막힌다.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/main.py",
    "src/config.py",
    "*/__init__.py",
    # WebSocket / scheduler 대부분 / 추천·로그 분석 엔진은 통합 단계가 아니라
    # 운영 환경 의존성이 강한 영역이라 단위 커버리지 측정에서 제외 (Phase G에서 별도 강화)
    "src/realtime/websocket.py",
    "src/engine/scheduler.py",
    "src/engine/recommendation_engine.py",
    "src/engine/log_analysis_engine.py",
    "src/engine/strategy.py",          # 사용 안 하는 구버전 잔재
    "src/db/log_reports.py",
    "src/db/parameter_recommendations.py",
    "src/db/daily_performance.py",
    "src/db/strategy_config.py",
    "src/db/system_logs.py",
    "src/db/positions.py",
    "src/db/trade_history.py",
    "src/db/supabase.py",
    "src/api/condition.py",            # 거래량순위/일봉/휴장일 — 통합 단계
    "src/api/order.py",                # respx 통합 단계
    "src/api/balance.py",              # 통합 단계
    "src/auth/hashkey.py",
    "src/realtime/handler.py",         # AES 복호화/체결통보 — 통합 단계
    "src/routes/system.py",            # psutil/tracemalloc 의존
    "src/routes/log_reports.py",       # 엔진 의존
    "src/routes/balance.py",           # KIS API 의존
    "src/routes/performance.py",       # DB 의존
    "src/routes/logs.py",              # DB 의존
]

[tool.coverage.report]
# 60%: Phase F 시점 핵심 영역 baseline. Phase G 에서 omit 항목들을 통합 테스트로 채워가며
# 게이트를 단계적으로 70 → 80 으로 상향한다.
# 측정 영역: strategy_base, 4 strategies, registry, session, order_engine, risk,
# routes(trading/strategies/recommendations/history), api/base, auth/token
fail_under = 60
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
