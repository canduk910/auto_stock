# 서버 배포용 — Docker Hub 이미지 사용
# DOCKERHUB_USERNAME 환경변수를 .env에 설정하거나 직접 이미지명 수정

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/auto_stock-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    env_file: .env
    environment:
      - PORT=8000
      - TZ=Asia/Seoul
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/auto_stock-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped