services:
  backend:
    build:
      context: .
      target: prod
    ports:
      # cycle243 Phase 2 — 루프백 바인딩. 종전 `"8000:8000"` 은 0.0.0.0 게시라 AWS 보안그룹이
      # **유일한 방어막**이었다. nginx(frontend 컨테이너)는 compose 네트워크로 붙으므로
      # 호스트 포트 공개가 필요 없다.
      # ⚠️ 이 한 줄이 backend 서비스 config 해시를 바꿔 **컨테이너를 재생성**한다 —
      # 그래서 Phase 1(무재시작) 커밋에 섞으면 안 되고, 배포는 15:30 이후다(cycle232 D6).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./.token_cache:/app/.token_cache  # 사이클 20 — 토큰 캐시 영속화 (분당 1개 한도 대응)
    env_file: .env
    environment:
      - PORT=8000
      - TZ=Asia/Seoul
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "80:80"
    volumes:
      # cycle243 Phase 1 — nginx Basic Auth 자격 파일. **git 에 커밋 금지**(.gitignore: secrets/).
      # 파일이 아니라 **디렉터리**를 마운트한다 — bind mount 소스가 없으면 Docker 가 호스트에
      # 빈 디렉터리를 만들어 마운트하는데, 파일로 걸면 "파일이 디렉터리가 되는" 상태가 된다.
      # 자격 파일 결손은 기동 실패가 아니다(요청 시점에 연다). 증상 3갈래(실측):
      #   무자격 → 401(정상과 동일) / 자격+파일부재 → 403 / 자격+권한거부 → 500.
      # ⚠️ 권한: nginx worker 는 **uid 101(nginx)**, 호스트 파일은 `ubuntu`(uid 1000) 소유다.
      # `chmod 600`/디렉터리 `chmod 700` 이면 자격 요청이 전부 500 이 된다
      # (`.token_cache` root 소유 사고와 동일 계열) → `chmod 755 secrets` + `644 .htpasswd`.
      # 배포 전 호스트에서 `secrets/.htpasswd` 생성이 하드 게이트다.
      - ./secrets:/etc/nginx/secrets:ro
      # cycle255 — ACME HTTP-01 챌린지 webroot. HTTP 서버 블록의 ACME location
      # (root /var/www/certbot, `frontend/nginx.conf.template`)이 실제로 파일을 읽으려면
      # **기본** compose 에도 같은 마운트가 있어야 한다 — TLS 오버레이(`docker-compose.tls.yml`)
      # 는 인증서 발급 *후*에야 켜지므로, 기본 경로에 마운트가 없으면 첫 발급 자체가
      # 불가능하다(닭·달걀). 디렉터리라 호스트에 없으면 Docker 가 빈 디렉터리를 만든다.
      - ./certbot-www:/var/www/certbot:ro
    environment:
      # `env_file: .env` 금지 — KIS·OPENAI 등 33개 비밀을 nginx 컨테이너 환경에 밀어 넣는다.
      # compose 는 프로젝트 디렉터리 `.env` 를 `${VAR}` 보간용으로 자동 로드하므로 이걸로 충분하다.
      # ⚠️ 이 줄을 지우면 컨테이너 환경에 변수가 **아예 없어** envsubst 가 치환을 건너뛰고
      # nginx 가 `[emerg] unknown "api_auth_key" variable` 로 기동 실패한다(실측). 반대로
      # `.env` 에 키가 없으면 빈 문자열로 정의돼 `X-API-Key ""` 로 렌더된다(헤더 미전달).
      # ⚠️ **`.env` 를 편집하면 `env_file: .env` 인 backend 가 재생성된다**(실측) — Phase 1
      # 무재시작 전제가 무너지므로 키 추가는 Phase 2 창(15:30 이후)에서만 한다.
      - API_AUTH_KEY=${API_AUTH_KEY}
      # cycle249 — 리포터 스코프 키. nginx `map $remote_user` 가 Basic 사용자 `reporter`
      # 에게만 이 값을 주입한다(운영 키와 별개). backend 블록은 이 변수를 받지 않는다
      # (D-5/D-16 — backend 를 건드리면 컨테이너가 재생성돼 장중 배포가 tick blind 를 만든다).
      - API_REPORTER_KEY=${API_REPORTER_KEY}
      # 치환 대상을 이 두 변수로 제한한다(앵커 필수 — 엔트리포인트가 부분 일치로 평가해
      # 앵커가 없으면 `API_AUTH_KEY_OLD` 류까지 걸린다).
      - NGINX_ENVSUBST_FILTER=^API_(AUTH|REPORTER)_KEY$
      - TZ=Asia/Seoul
    depends_on:
      - backend
      - macro
    restart: unless-stopped

  macro:
    # cycle303 — macro_lite 이식 1단계. 매매와 무관한 매크로 대시보드(경기사이클·금리차·
    # 하이일드·환율·원자재) 전용 API. **매매 판단에 값을 연결하지 않는다**
    # (cycle315 부터 `src/engine/market_regime.py` 가 이 컨테이너를 본다 — 전환은
    # 별도 승인 사이클). 자체 이미지(`./macro/Dockerfile`)로 매매 이미지와 완전 분리.
    build:
      context: ./macro
    # 🔴 `ports:` 를 절대 넣지 않는다 — compose 내부 네트워크(`frontend`→`macro:8000`)
    # 전용이다. 호스트에 게시하면 nginx Basic Auth 를 우회해 그대로 인증 없이 열린다
    # (이 컨테이너는 `AUTH_DEPENDENCY=None` — 보호는 nginx 한 겹뿐이다).
    volumes:
      # 영속 bind mount 필수(tmpfs 금지) — FRED 가 OAS 시리즈를 최근 3년치만 주므로
      # 누적 캐시가 사라지면 하이일드 스프레드 baseline 이 영구 퇴행한다
      # (`docs/macro-lite.md` 참조). 호스트 `./macro-cache` 는 **사람이 먼저 mkdir** —
      # compose 가 먼저 만들면 root:root 가 되어 컨테이너가 못 쓴다(`.token_cache` 사고와
      # 같은 계열, `macro/Dockerfile` 주석 참조).
      - ./macro-cache:/var/lib/macro-lite
    environment:
      - MACRO_LITE_CACHE_DIR=/var/lib/macro-lite
      # FRED JSON API 폴백 키(선택, 없어도 CSV 무키 경로 + 7일 stale 캐시로 동작).
      - FRED_API_KEY=${FRED_API_KEY:-}
      # FRED CSV 요청 타임아웃(초). 기본 25 를 그대로 두면 CSV 가 막힌 날
      # 25 x 2회 x 2시리즈 = 약 100초라 아래 nginx `proxy_read_timeout 60s` 를 넘겨
      # 하이일드·경기사이클이 504 가 된다. 8 이면 최악 32초 + JSON 폴백.
      - MACRO_LITE_FRED_TIMEOUT=8
      - TZ=Asia/Seoul
    # 🔴 `env_file: .env` 금지 — KIS·OPENAI 등 비밀 33개를 이 컨테이너에 밀어 넣는다
    # (frontend 블록과 같은 이유, 위 주석 참조). macro_lite 는 그 비밀 중 어느 것도
    # 쓰지 않는다 — 필요한 값은 `FRED_API_KEY` 하나뿐이고 그것만 명시 전달한다.
    restart: unless-stopped
