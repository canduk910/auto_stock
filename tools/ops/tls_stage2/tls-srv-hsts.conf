# cycle260 2단계 — HSTS, server 레벨(자체 add_header 가 없는 응답: `/api/`·아이콘 204 용).
#
# `always` 없이는 nginx 가 2xx/3xx 응답에만 헤더를 붙인다 — 이 사이트의 정상 응답은
# 무자격 401 이라 `always` 가 없으면 로그인 전 브라우저가 헤더를 못 받는다.
#
# max-age 는 1일(86400초)로 시작한다 — 브라우저에 되돌릴 수 없는 상태를 심으므로,
# 인증서 사고가 났을 때 80 으로 내려앉는 원복 경로가 반년씩 막히지 않도록 짧게
# 시작하고 1주 안정 후 별도 결정으로 상향한다. includeSubDomains(다른 dkstock.cloud
# 호스트까지 강제 https)·preload(사실상 영구) 는 이 단계에서 넣지 않는다.
#
# ⚠️ 이 파일은 `tls-loc-*.conf`(location 안)와 **다른 글롭**이 열어야 한다 — 같은
# `add_header Strict-Transport-Security` 가 server·location 양쪽에서 중복되면 값이
# `max-age=86400, max-age=86400` 이 되어 헤더 자체가 무효 처리된다.
add_header Strict-Transport-Security "max-age=86400" always;
