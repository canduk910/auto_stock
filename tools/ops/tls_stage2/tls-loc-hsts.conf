# cycle260 2단계 — HSTS, location 레벨(`location /` · 정적자산 location 전용).
#
# 이 두 location 은 이미 자기 `add_header`(Cache-Control)를 갖고 있어 server 레벨
# add_header 를 물려받지 못한다(nginx add_header 는 상속이 아니라 대체) — 그래서 문서·
# JS/CSS 응답에 HSTS 를 실으려면 이 파일을 location 안에서 다시 include 해야 한다.
# 값은 server 레벨 스니펫(`tls-srv-hsts.conf`)과 **반드시 동일**해야 하고, 두 파일은
# 서로 다른 글롭(`tls-srv-*.conf` / `tls-loc-*.conf`)으로 열려 절대 겹치지 않는다.
add_header Strict-Transport-Security "max-age=86400" always;
