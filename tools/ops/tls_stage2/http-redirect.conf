# cycle260 2단계 — 80 → 443 강제 리다이렉트, ACME 갱신 경로만 예외.
#
# `if` + `return` 은 nginx 가 "안전하다"고 문서로 보증하는 유일한 `if` 용법이다(그 외의
# `if` 는 rewrite 모듈 내부 상태를 오염시킬 수 있다고 공식 문서가 경고한다) — 그래서 이
# 블록 안에는 `return` 외 지시어를 두지 않는다.
#
# 도메인을 `$host`/`$http_host` 가 아니라 리터럴로 고정한다 — IP(3.38.228.74)로 들어온
# 요청을 변수 기반으로 리다이렉트하면 `https://3.38.228.74/` 가 되어 인증서 이름
# (`auto.dkstock.cloud` 단일 발급) 불일치로 브라우저가 막는다.
#
# ACME HTTP-01 챌린지(`/.well-known/acme-challenge/`)는 반드시 http 로만 검증되므로
# 이 리다이렉트에서 제외한다 — 제외하지 않으면 인증서 자동 갱신(90일 주기)이 조용히
# 끊긴다.
if ($uri !~ "^/\.well-known/acme-challenge/") { return 301 https://auto.dkstock.cloud$request_uri; }
